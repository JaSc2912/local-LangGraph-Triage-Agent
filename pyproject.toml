[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "insurance-ticket-triage"
version = "0.1.0"
description = "Local LangGraph workflow for insurance support ticket triage"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ftfy>=6.3,<7",
    "langgraph>=1.0,<2",
    "ollama>=0.6,<1",
    "pandas>=2.2,<4",
    "pydantic>=2.10,<3",
    "rich>=13.9,<15",
    "streamlit>=1.45,<2",
    "typer>=0.15,<1",
]

[project.scripts]
triage = "insurance_triage.cli:main"
triage-compare = "insurance_triage.compare:main"
triage-dashboard = "insurance_triage.dashboard:main"
triage-graph = "insurance_triage.graph_export:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/insurance_triage"]

[tool.pytest.ini_options]
addopts = "--cov=insurance_triage --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
